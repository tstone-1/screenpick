name: Release

# Builds installers and publishes them to a GitHub Release.
#
# macOS is signed with a Developer ID identity and notarized by Apple, so it
# installs without a Gatekeeper bypass. Windows has no Authenticode cert and is
# still unsigned — users bypass SmartScreen on first launch; see the "Install"
# section of README.md.
#
# Signing is conditional on the Apple secrets being present, so a fork without
# them still builds (ad-hoc signed, unnotarized).
#
# Trigger by pushing a CalVer tag, e.g.:
#   git tag v26.5.1 && git push origin v26.5.1

on:
  push:
    tags:
      - "v[0-9][0-9].[0-9]*.[0-9]*"

# Needed for tauri-action to create the GitHub Release and upload artifacts.
permissions:
  contents: write

jobs:
  # Gate: a tag on a broken commit must not produce release artifacts. Runs
  # the same frontend/Rust test invocations as ci.yml on the two platforms
  # the release job actually builds on.
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-2025]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: npm ci

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  release:
    name: ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      # SERIAL, deliberately. tauri-action builds the updater's `latest.json` by
      # read-modify-write against the release asset: download the existing one,
      # merge this platform's entries, delete it, re-upload. Two legs running at
      # once can both read the pre-merge state, and the second upload silently
      # drops the first platform's entry — producing a release that only updates
      # macOS *or* Windows, with nothing failing to indicate it. Serializing the
      # two builds costs wall-clock and nothing else.
      max-parallel: 1
      matrix:
        include:
          # One universal DMG that runs on both Apple Silicon and Intel Macs.
          - platform: macos-latest
            label: macOS (universal)
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-2025
            label: Windows (x64)
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: npm ci

      # macOS Developer ID signing + notarization.
      #
      # The vars are exported through $GITHUB_ENV rather than listed in the
      # build step's `env:` block, and that is load-bearing. A fork has none of
      # these secrets; `env:` would then hand the Tauri CLI an EMPTY
      # APPLE_SIGNING_IDENTITY, which it treats as "sign with this identity"
      # and fails on. Exporting conditionally leaves them genuinely unset, so
      # the CLI falls back to the ad-hoc "-" in tauri.conf.json and the fork
      # still builds.
      #
      # The CLI does the keychain import itself from APPLE_CERTIFICATE /
      # APPLE_CERTIFICATE_PASSWORD - no manual `security create-keychain` step
      # is needed, and it sets the key partition list so codesign never blocks
      # on an interactive prompt.
      - name: Prepare Apple signing and notarization
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::Apple signing secrets absent - building ad-hoc signed and UNNOTARIZED."
            exit 0
          fi

          # notarytool wants the key as a file on disk. RUNNER_TEMP is wiped
          # with the runner, so the key does not outlive the job.
          KEYS="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEYS"
          KEYFILE="$KEYS/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEYFILE"
          chmod 600 "$KEYFILE"

          # Heredoc form for the certificate: base64 may arrive wrapped, and a
          # multi-line value breaks the plain KEY=VALUE form.
          {
            echo "APPLE_CERTIFICATE<<__TAURI_EOF__"
            printf '%s\n' "$APPLE_CERTIFICATE"
            echo "__TAURI_EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$KEYFILE"
          } >> "$GITHUB_ENV"
          echo "Apple signing enabled for this build."

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign key for the updater. Every update payload is signed with it
          # and verified against `plugins.updater.pubkey` before install — the
          # only cryptographic control on the update path. Losing this key
          # permanently orphans the installed base (a new key cannot sign for
          # clients holding the old pubkey), so it is backed up outside CI.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The action defaults this to false, which would put the MSI in
          # latest.json while README.md points users at the NSIS setup.exe. An
          # MSI update on top of an NSIS install produces a second, parallel
          # installation instead of an upgrade.
          updaterJsonPreferNsis: true
          # Reuse the pushed tag (refs/tags/v26.5.1 -> v26.5.1) as the release
          # tag, so the release lines up with BUILD.md's tagging step.
          tagName: ${{ github.ref_name }}
          releaseName: "ScreenPick ${{ github.ref_name }}"
          releaseBody: |
            **macOS** — signed with a Developer ID identity and notarized by
            Apple. Open it normally; no Gatekeeper bypass needed.

            **Windows** — unsigned. SmartScreen warns on first launch: choose
            *More info* → *Run anyway*.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri's bundler notarizes and staples the .app, then builds the DMG and
      # only SIGNS it — the DMG itself is left unnotarized, and
      # `spctl -a -t open` rejects it as "Unnotarized Developer ID". Since the
      # DMG is what users download, opening it would still produce "Apple cannot
      # check it for malicious software". So notarize and staple the DMG too,
      # then replace the asset tauri-action already uploaded. The app inside is
      # unaffected — it is already stapled, and so is the updater tarball.
      - name: Notarize and staple the macOS DMG
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG" 2>&1 \
            | grep -q "source=Notarized Developer ID" \
            || { echo "::error::DMG is still not notarized after stapling"; exit 1; }
          echo "Replacing the uploaded DMG with the stapled one"
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber \
            --repo "$GITHUB_REPOSITORY"

      # A skipped notarization does NOT fail the build: when the credentials
      # are missing or malformed the bundler logs "skipping app notarization"
      # and exits 0, producing a signed-but-unnotarized app that Gatekeeper
      # rejects on any machine that has never seen it. Same looks-green shape
      # as a release with no latest.json. Gate on the artifact itself so that
      # cannot ship silently.
      - name: Verify the macOS build is signed, notarized and stapled
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/ScreenPick.app
          codesign -dv --verbose=4 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::not signed with a Developer ID identity"; exit 1; }
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::hardened runtime missing - notarization cannot succeed"; exit 1; }
          xcrun stapler validate "$APP"
          spctl -a -vvv -t exec "$APP" 2>&1 | grep -q "source=Notarized Developer ID" \
            || { echo "::error::Gatekeeper does not see this as notarized"; exit 1; }
          echo "macOS build verified: Developer ID signed, notarized, stapled."
