name: Release

# Builds installers and publishes them to a GitHub Release.
#
# macOS is signed with a Developer ID identity and notarized by Apple, so it
# installs without a Gatekeeper bypass. Windows is signed with a Certum Open
# Source Code Signing certificate, whose key is in Certum's SimplySign service;
# the "Build the Windows signing client" step has the detail, and BUILD.md the
# rules ("Windows code signing").
#
# Apple signing is conditional on the Apple secrets being present, so a fork
# without them still builds (ad-hoc signed, unnotarized). In this repository
# the macOS leg fails without them. Windows signing is not conditional: a
# Windows leg that cannot sign fails.
#
# Trigger by pushing a CalVer tag, e.g.:
#   git tag v26.5.1 && git push origin v26.5.1

on:
  push:
    tags:
      - "v[0-9][0-9].[0-9]*.[0-9]*"

# Read-only by default; only the release job below is granted write access.
permissions:
  contents: read

jobs:
  # Did CI already pass on the commit this tag names? `ci.yml` runs every
  # command of the `test` job below on every push to main, on the same two
  # runner images, so running them again here tested the same commit twice.
  # Measured on the run for v26.10.3-rc1: CI had finished on `df165d0` before
  # the tag was pushed, and the two test legs then took 8 and 13 minutes
  # before the first installer build could start.
  #
  # `passed` is 'true' only for a verified yes: a `push` run of `ci.yml` on
  # exactly this SHA, concluded `success`, with exactly three jobs and all
  # three `success`. Three is the number of jobs in `ci.yml`, and the count is
  # what keeps a run with a skipped or missing leg from counting.
  # Anything else -- no run, a failed one, a pull-request run, a run that is
  # still going, an API error -- leaves it unset, and `test` below runs in
  # full. A failure of THIS job runs the tests too, because `test` asks
  # `!cancelled()` and not for this job's success. The error path is the old
  # behaviour, never a skip. `src/lib/windowsSigning.test.ts` holds the number
  # of jobs and the commands of the two workflows against each other.
  proven:
    name: CI already passed this commit?
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.ci.outputs.passed }}
    steps:
      - name: Look for a green CI run on this SHA
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success&per_page=10" \
            --jq '.workflow_runs[].id') || { echo "::warning::could not list CI runs; running the tests"; exit 0; }
          for id in $runs; do
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=50" \
              --jq '[.jobs[].conclusion] | "\(length) \(all(. == "success"))"') || continue
            if [ "$jobs" = "3 true" ]; then
              echo "CI run $id passed all three jobs on $SHA; the tests below are skipped."
              echo "passed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No green three-job CI run on $SHA; running the tests."

  # Gate: a tag on a broken commit must not produce release artifacts. Runs
  # ci.yml's correctness gates verbatim — typecheck, Vitest, cargo test — on
  # the two platforms the release job actually builds on. `cargo fmt` and
  # clippy are deliberately left out: they cannot change the artifacts, and a
  # tag is the wrong place to fail on formatting. The typecheck is not
  # optional, though — `vite build` does not typecheck, so without it a commit
  # with a type error that still emits valid JS would publish installers.
  #
  # Skipped when `proven` found the same commands green in CI on this commit.
  # Every `run:` line here has to be in both the macOS and the Windows job of
  # `ci.yml`, or the skip would let through what only this job checks.
  test:
    name: Test (${{ matrix.platform }})
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.passed != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-2025]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: npm ci

      - name: TypeScript / Svelte check
        run: npm run check

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  # The same advisory check BUILD.md's release checklist runs, from src-tauri/
  # so it picks up .cargo/audit.toml. A job of its own, and never skipped: CI
  # does not run it, and its answer depends on the day and not only on the
  # commit, because the advisory database is fetched when it runs. It reads
  # Cargo.lock and nothing else, so one runner is enough.
  #
  # cargo-audit is a released binary at a fixed version, checked against the
  # digest the pinned action carries. It used to be compiled from source in
  # both test legs, which took 4.2 and 6.1 minutes of the run for
  # v26.10.3-rc1. `fallback: none` keeps the action from building it after all
  # when the download fails; the job fails instead.
  audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Rust dependency audit
        working-directory: src-tauri
        run: cargo audit -f Cargo.lock

  release:
    name: ${{ matrix.label }}
    needs: [proven, test, audit]
    # A job whose `needs` holds a skipped job is skipped itself unless it says
    # otherwise, so this says when to build: the audit passed, and the tests
    # either passed here or were skipped because CI had passed them on this
    # commit. Tests that ran and failed, or were cancelled, build nothing.
    if: >-
      ${{ !cancelled() && needs.audit.result == 'success'
      && (needs.test.result == 'success'
      || (needs.test.result == 'skipped' && needs.proven.outputs.passed == 'true')) }}
    # Needed for tauri-action to create the GitHub Release and upload artifacts.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # SERIAL, deliberately. tauri-action builds the updater's `latest.json` by
      # read-modify-write against the release asset: download the existing one,
      # merge this platform's entries, delete it, re-upload. Two legs running at
      # once can both read the pre-merge state, and the second upload silently
      # drops the first platform's entry — producing a release that only updates
      # macOS *or* Windows, with nothing failing to indicate it. Serializing the
      # two builds costs wall-clock and nothing else.
      max-parallel: 1
      matrix:
        include:
          # One universal DMG that runs on both Apple Silicon and Intel Macs.
          - platform: macos-latest
            label: macOS (universal)
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            signs-windows: false
          - platform: windows-2025
            label: Windows (x64)
            args: ""
            rust-targets: ""
            signs-windows: true

    runs-on: ${{ matrix.platform }}
    # The Certum login is in this environment and in no other place, and the
    # environment accepts the main branch and `v*` tags only. Both legs name it
    # because a job has one environment; only the Windows leg reads its secrets.
    environment: signing
    # One SimplySign code is good for one login. A second job logging in
    # inside the same 30 seconds fails, and repeated failed logins can lock the
    # account, so everything that signs shares this group and nothing in it is
    # cancelled. `sign-rehearsal.yml` is the other member. The group holds for
    # this repository only: see BUILD.md for the other projects that sign with
    # the same account.
    #
    # The Windows leg only. The macOS leg logs in nowhere, and in the group it
    # would wait behind a rehearsal and could be cancelled by a second one:
    # GitHub keeps one waiting job per group and drops the older one. It gets a
    # group of its own that nothing else can be in.
    concurrency:
      group: ${{ matrix.signs-windows && 'certum-signing' || format('release-{0}-{1}', github.run_id, matrix.platform) }}
      cancel-in-progress: false
    env:
      # ssign v0.1.7. A commit and not a tag: a tag can be moved. Here and not
      # in a step, because the key of the cache below is made from it.
      SSIGN_REV: 5fd4daf22155b19b645aef3dd467f3c4c9e440b3
    steps:
      - uses: actions/checkout@v5
        with:
          # This job holds the signing logins and runs `npm ci` beside them.
          # Nothing after the checkout needs git to authenticate: the steps
          # that talk to GitHub take a token through the environment.
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: npm ci

      # macOS Developer ID signing + notarization.
      #
      # The vars are exported through $GITHUB_ENV rather than listed in the
      # build step's `env:` block, and that is load-bearing. A fork has none of
      # these secrets; `env:` would then hand the Tauri CLI an EMPTY
      # APPLE_SIGNING_IDENTITY, which it treats as "sign with this identity"
      # and fails on. Exporting conditionally leaves them genuinely unset, so
      # the CLI falls back to the ad-hoc "-" in tauri.conf.json and the fork
      # still builds.
      #
      # The CLI does the keychain import itself from APPLE_CERTIFICATE /
      # APPLE_CERTIFICATE_PASSWORD - no manual `security create-keychain` step
      # is needed, and it sets the key partition list so codesign never blocks
      # on an interactive prompt.
      - name: Prepare Apple signing and notarization
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            # Here a missing secret is a mistake, usually one left out when the
            # certificate was renewed. The two checks at the end of this job
            # are skipped without the secrets, so going on would publish a
            # green, unnotarized build that Gatekeeper rejects.
            if [ "$GITHUB_REPOSITORY" = "tstone-1/screenpick" ]; then
              echo "::error::APPLE_CERTIFICATE or APPLE_API_KEY_P8 is not set, so this release could not be notarized."
              exit 1
            fi
            echo "::warning::Apple signing secrets absent - building ad-hoc signed and UNNOTARIZED."
            exit 0
          fi

          # notarytool wants the key as a file on disk. RUNNER_TEMP is wiped
          # with the runner, so the key does not outlive the job.
          KEYS="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEYS"
          KEYFILE="$KEYS/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEYFILE"
          chmod 600 "$KEYFILE"

          # Heredoc form for the certificate: base64 may arrive wrapped, and a
          # multi-line value breaks the plain KEY=VALUE form.
          {
            echo "APPLE_CERTIFICATE<<__TAURI_EOF__"
            printf '%s\n' "$APPLE_CERTIFICATE"
            echo "__TAURI_EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$KEYFILE"
          } >> "$GITHUB_ENV"
          echo "Apple signing enabled for this build."

      # Windows files are signed by ssign, an unofficial client (MIT) for
      # Certum's SimplySign service: Certum supports a login from its desktop
      # program only, and that program needs a person and a phone. Built from a
      # pinned commit of its source, and a commit and not a tag, so that a later
      # change to the tool cannot reach the login without a change here. Built
      # outside the checkout, so nothing in this repository decides how
      # somebody else's program is built. `sign-rehearsal.yml` proves the same
      # build and login without building ScreenPick.
      #
      # The built client is kept in a cache, because building it took 2.9
      # minutes of every release. The key is the runner and the commit, and
      # there are no `restore-keys`: a client built from another commit is
      # never restored. A run on a tag can read only a cache saved on the
      # default branch, so the one a release finds is the one
      # `sign-rehearsal.yml` saved on `main`; a tag that finds none builds the
      # client as before. The folder is one of its own under the runner's
      # temporary folder, which the cargo cache above does not look at.
      # BUILD.md, "The cached signing client", has the rules.
      - name: Restore the Windows signing client
        id: ssign
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\ssign-client
          key: ssign-${{ runner.os }}-${{ runner.arch }}-${{ env.SSIGN_REV }}

      - name: Build the Windows signing client
        if: runner.os == 'Windows' && steps.ssign.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          cargo install --locked --git https://github.com/Le-Syl21/ssign --rev $env:SSIGN_REV --root "$env:RUNNER_TEMP\ssign-client" ssign
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Always, restored or built: the client has to start, and Tauri is given
      # the wrapper and finds it where it finds ssign.
      - name: Put the Windows signing client on the path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'ssign-client\bin'
          & (Join-Path $bin 'ssign.exe') --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'tools\sign-windows.cmd') $bin -Force
          Add-Content -Path $env:GITHUB_PATH -Value $bin -Encoding utf8

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by ssign, which Tauri starts once for every Windows executable
          # it bundles and once for the installer. The first start logs in and
          # the later ones reuse that session, so one build is one login. Empty
          # on the macOS leg, which signs nothing with them.
          CERTUM_EMAIL: ${{ runner.os == 'Windows' && secrets.CERTUM_EMAIL || '' }}
          CERTUM_OTP: ${{ runner.os == 'Windows' && secrets.CERTUM_OTP_URI || '' }}
          # Where sign-windows.cmd finds the script that does the work. It
          # cannot look beside itself: see the file.
          SCREENPICK_SIGN_SCRIPT: ${{ github.workspace }}/tools/sign-windows.ps1
          # Minisign key for the updater. Every update payload is signed with it
          # and verified against `plugins.updater.pubkey` before install — the
          # only cryptographic control on the update path. Losing this key
          # permanently orphans the installed base (a new key cannot sign for
          # clients holding the old pubkey), so it is backed up outside CI.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # No MSI is built any more (`bundle.targets` in tauri.conf.json), so
          # the NSIS setup.exe is the only Windows payload there is. Kept so
          # that `windows-x86_64` in latest.json stays the setup.exe if an MSI
          # target ever comes back: an MSI update on top of an NSIS install
          # produces a second, parallel installation instead of an upgrade.
          updaterJsonPreferNsis: true
          # Reuse the pushed tag (refs/tags/v26.5.1 -> v26.5.1) as the release
          # tag, so the release lines up with BUILD.md's tagging step.
          tagName: ${{ github.ref_name }}
          releaseName: "ScreenPick ${{ github.ref_name }}"
          releaseBody: |
            **macOS** — signed with a Developer ID identity and notarized by
            Apple. Open it normally; no Gatekeeper bypass needed.

            **Windows** — signed; the publisher reads *Open Source Developer
            Timo Stein*. The certificate is new, so SmartScreen can still warn
            on first launch: choose *More info* → *Run anyway*.

            **Which file to take.** macOS: the `.dmg`. Windows: the
            `-setup.exe`. There is no `.msi` any more: if you installed
            ScreenPick from one, uninstall it once in Windows *Settings* →
            *Apps* and install the `-setup.exe`. The `.sig`, `.tar.gz` and
            `latest.json` files belong to the built-in updater.

            [Code signing policy](https://github.com/tstone-1/screenpick#code-signing-policy)
          releaseDraft: true
          prerelease: false
          # The overlay, on the Windows leg only, names the program Tauri signs
          # every Windows executable with. It is an overlay and not part of
          # tauri.conf.json because there it would make every build on a
          # development machine ask for a signing login. Its path is put
          # together here and not in the matrix, where `github.workspace` is
          # empty and the path would come out as
          # `/src-tauri/tauri.signing.conf.json`.
          args: ${{ matrix.args }} ${{ matrix.signs-windows && format('--config {0}/src-tauri/tauri.signing.conf.json', github.workspace) || '' }}

      # ssign keeps its session in a file for twenty minutes, under %HOME%\.cache
      # where HOME is set and under the temporary folder where it is not.
      # Nothing after the build signs, so it goes, whether the build passed or not.
      - name: Remove the Windows signing session
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $places = @((Join-Path ([IO.Path]::GetTempPath()) 'ssign'))
          foreach ($root in $env:HOME, $env:USERPROFILE) { if ($root) { $places += Join-Path $root '.cache\ssign' } }
          foreach ($place in $places) { Write-Output "$place present: $(Test-Path $place)"; Remove-Item -Recurse -Force $place -ErrorAction SilentlyContinue }

      # Tauri prints nothing of a sign command that failed, so this is where a
      # failed signature gets its reason. The line naming the card is left out.
      - name: Show what the signing client said
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ssign.log'
          if (Test-Path $log) { Get-Content $log | Where-Object { $_ -notmatch 'card ' } } else { Write-Output 'no signing log: the sign command never ran' }

      # Nothing in the build reads a signature back, so this step does. The
      # installer on the release is this one: the updater signature beside it
      # is over these bytes.
      #
      # What ScreenPick consists of is then read where the installer puts it,
      # and not from a list of names: every .exe and .dll in the installation
      # folder has to be signed, so a file the bundle gains later is covered
      # without a change here. The uninstaller is the reason to install at
      # all. It is not a file in the installer: the installer writes it, and
      # makensis signs it while building and goes on when that fails.
      - name: Verify the Windows build is signed
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNER: Open Source Developer Timo Stein
        run: |
          $setup = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { Write-Output "::error::expected one NSIS installer, found $($setup.Count)"; exit 1 }
          $msi = @(Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -Filter '*.msi' -ErrorAction SilentlyContinue)
          if ($msi.Count -ne 0) { Write-Output "::error::an .msi was built, and nothing here can sign one: $($msi.Name -join ', ')"; exit 1 }
          tools/verify_signature.ps1 -Signer $env:SIGNER -Path $setup[0].FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $folder = Join-Path $env:LOCALAPPDATA 'ScreenPick'
          if (Test-Path $folder) { Write-Output "::error::$folder exists before installing, so its files would not show what this build installs"; exit 1 }
          $run = Start-Process $setup[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($run.ExitCode -ne 0) { Write-Output "::error::the signed installer did not install (exit code $($run.ExitCode))"; exit 1 }
          $installed = @(Get-ChildItem $folder -Recurse -File -ErrorAction SilentlyContinue | Where-Object Extension -in '.exe', '.dll')
          foreach ($name in 'screenpick.exe', 'uninstall.exe') {
            if ($installed.Name -notcontains $name) { Write-Output "::error::the installer left no $name in $folder"; exit 1 }
          }
          tools/verify_signature.ps1 -Signer $env:SIGNER -Path $installed.FullName

      # Tauri's bundler notarizes and staples the .app, then builds the DMG and
      # only SIGNS it — the DMG itself is left unnotarized, and
      # `spctl -a -t open` rejects it as "Unnotarized Developer ID". Since the
      # DMG is what users download, opening it would still produce "Apple cannot
      # check it for malicious software". So notarize and staple the DMG too,
      # then replace the asset tauri-action already uploaded. The app inside is
      # unaffected — it is already stapled, and so is the updater tarball.
      - name: Notarize and staple the macOS DMG
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG" 2>&1 \
            | grep -q "source=Notarized Developer ID" \
            || { echo "::error::DMG is still not notarized after stapling"; exit 1; }
          echo "Replacing the uploaded DMG with the stapled one"
          gh release upload "$TAG_NAME" "$DMG" --clobber \
            --repo "$GITHUB_REPOSITORY"

      # A skipped notarization does NOT fail the build: when the credentials
      # are malformed the bundler logs "skipping app notarization" and exits 0,
      # producing a signed-but-unnotarized app that Gatekeeper rejects on any
      # machine that has never seen it. Same looks-green shape as a release
      # with no latest.json. Gate on the artifact itself so that cannot ship
      # silently.
      #
      # This step covers credentials that are present and wrong. It is skipped
      # when they are absent, as on a fork; in this repository the prepare
      # step has already failed the job in that case.
      - name: Verify the macOS build is signed, notarized and stapled
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/ScreenPick.app
          codesign -dv --verbose=4 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::not signed with a Developer ID identity"; exit 1; }
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::hardened runtime missing - notarization cannot succeed"; exit 1; }
          xcrun stapler validate "$APP"
          spctl -a -vvv -t exec "$APP" 2>&1 | grep -q "source=Notarized Developer ID" \
            || { echo "::error::Gatekeeper does not see this as notarized"; exit 1; }
          echo "macOS build verified: Developer ID signed, notarized, stapled."

  # A release whose `latest.json` is missing, or names one platform only,
  # updates nobody on the platform left out, and every step above is green:
  # tauri-action logs "Signature not found for the updater JSON. Skipping
  # upload..." when the updater key is empty, and a manifest written by two
  # legs at once loses an entry (see `max-parallel` above). So read the
  # manifest back once both legs are done, while the release is still a draft.
  manifest:
    name: Check the updater manifest
    needs: release
    # `test` is skipped when CI has proven the commit, and a job behind a
    # skipped one is skipped as well unless it says otherwise.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    # A draft release is not visible to a read-only token.
    permissions:
      contents: write
    steps:
      - name: Check that latest.json names every platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          # One universal macOS build serves both architectures; Windows is
          # x64. The keys an installed copy asks for.
          WANTED: darwin-aarch64 darwin-x86_64 windows-x86_64
        run: |
          set -euo pipefail
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir "$RUNNER_TEMP/manifest" \
            || { echo "::error::the release has no latest.json, so no installed copy would update. Is TAURI_SIGNING_PRIVATE_KEY set?"; exit 1; }
          FILE="$RUNNER_TEMP/manifest/latest.json"
          jq '.version, (.platforms | keys)' "$FILE"

          if [ "$(jq -r '.version' "$FILE")" != "${TAG_NAME#v}" ]; then
            echo "::error::latest.json is for another version than $TAG_NAME"
            exit 1
          fi
          for key in $WANTED; do
            jq -e --arg key "$key" \
              '.platforms[$key] | ((.url // "") != "") and ((.signature // "") != "")' \
              "$FILE" > /dev/null \
              || { echo "::error::latest.json has no signed entry for $key, so that platform would not update"; exit 1; }
          done
          # An MSI update over an NSIS install makes a second installation.
          jq -e '.platforms["windows-x86_64"].url | endswith("-setup.exe")' "$FILE" > /dev/null \
            || { echo "::error::windows-x86_64 in latest.json is not the setup.exe"; exit 1; }
          jq -e '.platforms | has("windows-x86_64-msi") | not' "$FILE" > /dev/null \
            || { echo "::error::latest.json names an .msi, and none is built"; exit 1; }
          echo "latest.json names every platform of $TAG_NAME."
